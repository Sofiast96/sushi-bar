<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Sakura Sushi — Найкращі роли в місті</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Sakura SUSHI</h1>
    </header>
    <div class="hero">
        <h2>Смак справжньої Японії у вас вдома!</h2>
        <p>Замовляйте найсвіжіші роли одним натисканням.</p>
    </div>
    <div class="menu">
        </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const supabaseUrl = 'https://fyhmksqvkzseiszcxccq.supabase.co';
        const supabaseKey = 'sb_publishable_FgCrL-f9_H35arFCZ-liqw_r41Po-v_';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey);

        async function loadSushi() {
            const { data, error } = await _supabase.from('products').select('*');

            if (error) {
                console.error("Помилка бази:", error.message);
                return;
            }

            if (data) {
                const menuContainer = document.querySelector('.menu');
                // Створюємо картки на основі даних з таблиці
                menuContainer.innerHTML = data.map(item => `
                    <div class="card">
                        <h3>${item.name}</h3>
                        <p>${item.description}</p>
                        <p class="price">${item.price} грн</p>
                        <button>В кошик</button>
                    </div>
                `).join('');
            }
        }

        loadSushi();
    </script>
</body>
</html>
