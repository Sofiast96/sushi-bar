<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Sakura Sushi — Найкращі роли в місті</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Sakura SUSHI</h1>
    </header>
    <div class="hero">
        <h2>Смак справжньої Японії у вас вдома!</h2>
        <p>Замовляйте найсвіжіші роли одним натисканням.</p>
    </div>
    <div class="menu">
        <div class="card">
            <h3>Філадельфія</h3>
            <p>Лосось, сир, огірок</p>
            <p><strong>250 грн</strong></p>
            <button>В кошик</button>
        </div>
        <div class="card">
            <h3>Каліфорнія</h3>
            <p>Краб, авокадо, ікра</p>
            <p><strong>190 грн</strong></p>
            <button>В кошик</button>
        </div>
    </div>
</body>
</html>
